# PER-RELEASE APP STACK — booted per deploy under the project of one color:
#   COLOR=blue  IMAGE_TAG=sha-abc1234 docker compose -p fdg_blue  -f <this file> up -d --wait
#   COLOR=green IMAGE_TAG=sha-def5678 docker compose -p fdg_green -f <this file> up -d --wait
# The deploy script ALWAYS exports COLOR deliberately; the ${COLOR:-blue}
# default below only exists so a bare local `up` boots something (blue).
# There is deliberately NO top-level name: the -p flag names the project,
# and the two colors must never share one.
#
# The persistent platform (postgres + redis + mongo, project fdg_platform)
# lives in docker-compose-platform.yml and is booted BEFORE any app stack:
# the server's startup migration is best-effort, so the boot race is won by
# deploy ORDERING (platform `up -d --wait` fully healthy first) — depends_on
# cannot cross compose files. The app_internal network is project-scoped ON
# PURPOSE: each color's `server` service-name DNS resolves only within its
# own color, so nginx's baked `proxy_pass http://server:8000` always reaches
# the SAME color's API, never the other release's.
services:
  server:
    image: "ghcr.io/mayank-uk/fastapi-guide-server:${IMAGE_TAG:?IMAGE_TAG is required}"
    container_name: fdg_server_${COLOR:-blue}
    restart: unless-stopped
    # No published ports — the API stays internal; nginx's /api proxy is the
    # only caller. Debug hatch: - "127.0.0.1:8000:8000"
    env_file:
      - ./../server/.env.production
    environment:
      # environment: beats env_file:, so these win over any .env.production
      # values. The platform datastores are reachable by their network
      # ALIASES on the shared fdg_backend network.
      - FDG_ENV=prod
      # Compose-level fail-fast: the required-variable syntax makes an unset
      # FDG_DB_PASSWORD a deploy-time error — `docker compose ... up` refuses
      # to render the stack at all, before any container starts. The deploy/
      # CI shell sources server/.env.production so the SAME password the
      # platform's POSTGRES_PASSWORD consumed lands in the app's URL.
      - FDG_DATABASE_URL=postgresql+asyncpg://postgres:${FDG_DB_PASSWORD:?FDG_DB_PASSWORD must be set to a real database password}@postgres:5432/guide
      # The signing secrets ride the SAME required-variable rail: unset
      # values refuse at `compose config` time, and the server's AppConfig
      # validator refuses any dev-default secret in this env a second time
      # at boot — two independent doors, both closed. The deploy/CI shell
      # sources server/.env.production (which carries real values for both)
      # before any compose command, so the rail is always satisfiable.
      - FDG_JWT_SECRET=${FDG_JWT_SECRET:?FDG_JWT_SECRET must be set to a real high-entropy signing secret}
      - FDG_SESSION_SECRET=${FDG_SESSION_SECRET:?FDG_SESSION_SECRET must be set to a real high-entropy signing secret, distinct from FDG_JWT_SECRET}
      - FDG_REDIS_URL=redis://redis:6379
      - FDG_MONGO_URL=mongodb://mongo:27017
    healthcheck:
      # The runtime image is python:3.13-slim — no wget, no curl. The venv
      # python (first on the image PATH) is the probe binary: urllib GET on
      # the real liveness route, dependency-free by design (the app's own
      # health contract).
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Generous on purpose: a cold boot on a fresh volume runs the startup
      # migration (alembic 0001→head) before serving.
      start_period: 30s
    networks:
      - app_internal
      - fdg_backend

  client:
    image: "ghcr.io/mayank-uk/fastapi-guide-client:${IMAGE_TAG:?IMAGE_TAG is required}"
    container_name: fdg_client_${COLOR:-blue}
    restart: unless-stopped
    # No published ports — Caddy is the front door (TLS on :443) and reaches
    # this container BY NAME (fdg_client_<color>) on the shared fdg_frontend
    # network; nginx is the internal app server behind it. Debug hatch
    # (loopback, non-TLS): - "127.0.0.1:8080:80"
    networks:
      - app_internal
      - fdg_frontend
    depends_on:
      # Long form: the app tier waits for its API — same color, same
      # project, so the gate still works per release.
      server:
        condition: service_healthy
    healthcheck:
      # Prove the app tier answers, independent of the API gate. nginx:alpine
      # ships busybox wget.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  # Plain project-scoped network: fdg_blue_app_internal / fdg_green_app_internal.
  # THIS is the isolation unit — nginx's `proxy_pass http://server:8000` and
  # this file's depends_on resolve `server` inside the color's own network.
  app_internal: {}
  # Shared with the platform stack (external, created by the deploy): caddy
  # reaches fdg_client_<color> here.
  fdg_frontend:
    name: fdg_frontend
    external: true
  # Shared with the platform stack: postgres + redis + mongo live here by
  # alias.
  fdg_backend:
    name: fdg_backend
    external: true
